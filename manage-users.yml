
name: The Lion - Manage Users

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Add or delete
        required: true
        type: choice
        options:
          - add
          - delete
      device_id:
        description: Device ID
        required: true
        type: string
      key:
        description: Key for adding
        required: false
        type: string
      expirydate:
        description: Expiry DD-MM-YYYY
        required: true
        default: "31-12-2099"
        type: string
      Allowoffline:
        description: Allow offline
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: manage-user-json
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update users
        env:
          OP: ${{ inputs.operation }}
          DID: ${{ inputs.device_id }}
          USER_KEY: ${{ inputs.key }}
          EXPIRY: ${{ inputs.expirydate }}
          OFFLINE: ${{ inputs.Allowoffline }}
        run: |
          python3 <<'PY'
          import json, os, re
          from pathlib import Path
          from datetime import datetime

          p = Path("user.json")
          users = json.loads(p.read_text(encoding="utf-8"))
          if not isinstance(users, list):
              raise SystemExit("user.json must be a JSON array")

          op = os.environ["OP"]
          did = os.environ["DID"].strip()
          matches = [u for u in users if isinstance(u, dict) and str(u.get("device_id", "")) == did]

          if not did:
              raise SystemExit("Device ID required")

          if op == "add":
              key = os.environ["USER_KEY"].strip()
              expiry = os.environ["EXPIRY"].strip()
              if not key:
                  raise SystemExit("Key required")
              if matches:
                  raise SystemExit("Device ID already exists")
              if not re.fullmatch(r"\d{2}-\d{2}-\d{4}", expiry):
                  raise SystemExit("Use DD-MM-YYYY")
              try:
                  datetime.strptime(expiry, "%d-%m-%Y")
              except ValueError:
                  raise SystemExit("Invalid date")

              users.append({
                  "device_id": did,
                  "key": key,
                  "expirydate": expiry,
                  "Allowoffline": os.environ["OFFLINE"].lower() == "true"
              })
          elif op == "delete":
              if not matches:
                  raise SystemExit("Device ID not found")
              users = [u for u in users if not (isinstance(u, dict) and str(u.get("device_id", "")) == did)]
          else:
              raise SystemExit("Invalid operation")

          p.write_text(json.dumps(users, ensure_ascii=False, indent=4) + "\n", encoding="utf-8")
          PY

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add user.json
          git diff --cached --quiet && exit 0
          git commit -m "Manage users"
          git push origin HEAD:main
          
