
name: Manage Users

"on":
  workflow_dispatch:
    inputs:
      operation:
        description: "Add or delete a user"
        required: true
        type: choice
        options:
          - add
          - delete
      device_id:
        description: "Device ID"
        required: true
        type: string
      key:
        description: "User key (required for add)"
        required: false
        type: string
      expirydate:
        description: "Expiry date DD-MM-YYYY (required for add)"
        required: false
        type: string
      Allowoffline:
        description: "Allow offline"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-users:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and update user.json
        env:
          OPERATION: ${{ inputs.operation }}
          DEVICE_ID: ${{ inputs.device_id }}
          USER_KEY: ${{ inputs.key }}
          EXPIRYDATE: ${{ inputs.expirydate }}
          ALLOW_OFFLINE: ${{ inputs.Allowoffline }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys

          path = "user.json"

          with open(path, "r", encoding="utf-8") as f:
              users = json.load(f)

          if not isinstance(users, list):
              sys.exit("ERROR: user.json must contain a JSON array")

          operation = os.environ["OPERATION"]
          device_id = os.environ["DEVICE_ID"].strip()

          if not device_id:
              sys.exit("ERROR: Device ID cannot be empty")

          if not all(isinstance(u, dict) for u in users):
              sys.exit("ERROR: Every user entry must be a JSON object")

          if operation == "add":
              if any(u.get("device_id") == device_id for u in users):
                  sys.exit("ERROR: This device_id already exists")

              key = os.environ.get("USER_KEY", "").strip()
              expiry = os.environ.get("EXPIRYDATE", "").strip()
              allow_offline = (
                  os.environ.get("ALLOW_OFFLINE", "false").lower() == "true"
              )

              if not key:
                  sys.exit("ERROR: Key is required when adding a user")

              if not re.fullmatch(r"\d{2}-\d{2}-\d{4}", expiry):
                  sys.exit("ERROR: Expiry date must use DD-MM-YYYY")

              from datetime import datetime
              try:
                  datetime.strptime(expiry, "%d-%m-%Y")
              except ValueError:
                  sys.exit("ERROR: Expiry date is not a valid date")

              users.append({
                  "device_id": device_id,
                  "key": key,
                  "expirydate": expiry,
                  "Allowoffline": allow_offline
              })

          elif operation == "delete":
              original_count = len(users)
              users = [
                  u for u in users
                  if u.get("device_id") != device_id
              ]

              if len(users) == original_count:
                  sys.exit("ERROR: Device ID was not found")

          else:
              sys.exit("ERROR: Unsupported operation")

          with open(path, "w", encoding="utf-8") as f:
              json.dump(users, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("user.json updated successfully")
          PY

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add user.json
          git diff --cached --quiet || git commit -m "Manage users"
          git push
          
