
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Generator</title>
<style>
body {
  background: #0b1020;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
}
.box {
  max-width: 400px;
  margin: auto;
  background: #151e30;
  padding: 20px;
  border-radius: 15px;
}
input, button {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  box-sizing: border-box;
  border-radius: 8px;
}
input {
  background: #080d18;
  color: white;
  border: 1px solid #33445e;
}
button {
  background: #0785ff;
  color: white;
  border: 0;
  font-weight: bold;
}
pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: #080d18;
  padding: 12px;
  direction: ltr;
  user-select: text;
}
</style>
</head>
<body>
<div class="box">
<h2>User Information Generator</h2>

<input id="device" placeholder="Device ID">
<input id="key" placeholder="Key">
<input id="expiry" type="date" value="2099-12-31">

<button id="generateBtn" type="button">Generate JSON</button>

<pre id="output">JSON output will appear here.</pre>

<button id="copyBtn" type="button">Copy JSON</button>
<div id="message"></div>
</div>

<script>
document.getElementById("generateBtn").addEventListener("click", function() {
  const device = document.getElementById("device").value.trim();
  const key = document.getElementById("key").value.trim();
  const date = document.getElementById("expiry").value;
  const output = document.getElementById("output");
  const message = document.getElementById("message");

  if (!device || !key || !date) {
    message.textContent = "Please fill in all fields.";
    return;
  }

  const parts = date.split("-");
  const expiry = parts[2] + "-" + parts[1] + "-" + parts[0];

  output.textContent =
    '{\n' +
    '        "device_id": "' + device + '",\n' +
    '        "key": "' + key + '",\n' +
    '        "expirydate": "' + expiry + '",\n' +
    '        "Allowoffline": false\n' +
    '    },';

  message.textContent = "";
});

document.getElementById("copyBtn").addEventListener("click", function() {
  const output = document.getElementById("output");
  const message = document.getElementById("message");

  if (output.textContent === "JSON output will appear here.") {
    message.textContent = "Please generate JSON first.";
    return;
  }

  const area = document.createElement("textarea");
  area.value = output.textContent;
  area.style.position = "fixed";
  area.style.left = "-9999px";
  document.body.appendChild(area);
  area.select();

  let ok = false;
  try {
    ok = document.execCommand("copy");
  } catch (e) {}

  area.remove();
  message.textContent = ok ? "" : "Select the JSON text and copy it manually.";
});
</script>
</body>
</html>
